name: Sync upstream

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git identity
        run: |
          git config user.email "geekwrt@users.noreply.github.com"
          git config user.name "GeekWRT"

      - name: Sync with upstream
        run: |
          set -e
          git remote add upstream https://github.com/jow-/uwsd.git
          git fetch origin master
          git fetch upstream master

          UPSTREAM=$(git rev-parse upstream/master)
          FORK=$(git rev-parse origin/master)

          if [ "$UPSTREAM" = "$FORK" ] || git merge-base --is-ancestor origin/master upstream/master 2>/dev/null; then
            echo "Already up to date"
            exit 0
          fi

          git merge --ff-only upstream/master || {
            echo "Not fast-forward, creating merge commit..."
            git merge upstream/master -m "Merge upstream/master into master" || {
              echo "CONFLICT! aborting..."
              git merge --abort
              exit 1
            }
          }
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git master
